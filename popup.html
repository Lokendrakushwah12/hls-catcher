<meta charset="utf-8">
<title>HLS Catcher</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    width: 420px;
    margin: 0;
    padding: 10px;
    font: 13px/1.45 -apple-system, system-ui, sans-serif;
    background: #0f0f10;
    color: #ececee;
  }
  .shell {
    background: #1a1a1d;
    border: 1px solid #2b2b2f;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
  }
  .header {
    padding: 12px 14px 10px;
    border-bottom: 1px solid #2b2b2f;
    background: linear-gradient(180deg, #202024, #19191c);
  }
  .titleRow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    letter-spacing: 0.01em;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: linear-gradient(180deg, #7dd3fc, #3b82f6);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
  }
  .subtitle {
    margin-top: 5px;
    font-size: 12px;
    color: #a1a1aa;
  }
  .banner {
    margin: 10px 14px 12px;
    padding: 12px;
    border-radius: 12px;
    background: linear-gradient(180deg, #26262c, #202024);
    border: 1px solid #34343a;
  }
  .bannerTitle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-weight: 650;
    margin-bottom: 6px;
  }
  .bannerText {
    color: #b5b5be;
    font-size: 12px;
    margin-bottom: 10px;
  }
  .bannerBar {
    height: 6px;
    border-radius: 999px;
    background: #2f2f35;
    overflow: hidden;
  }
  .bannerBar > span {
    display: block;
    width: 52%;
    height: 100%;
    background: linear-gradient(90deg, #38bdf8, #2563eb);
  }
  .bannerActions {
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    color: #a1a1aa;
    font-size: 12px;
  }
  .bannerBtn {
    background: #2e2e35;
    color: #e8e8ea;
    border: 1px solid #3a3a42;
    border-radius: 999px;
    padding: 6px 10px;
    font: inherit;
  }
  .list {
    padding: 0 10px 10px;
  }
  .stream {
    background: #232328;
    border: 1px solid #34343a;
    border-radius: 12px;
    padding: 10px;
    margin-bottom: 10px;
  }
  .streamTop {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
  }
  .meta {
    min-width: 0;
    flex: 1;
  }
  .chipRow {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-bottom: 4px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    border-radius: 999px;
    padding: 2px 7px;
    font-size: 11px;
    border: 1px solid #3d3d46;
    background: #2a2a31;
    color: #c9cad1;
  }
  .chip.blue { background: rgba(59, 130, 246, 0.14); color: #93c5fd; border-color: rgba(59, 130, 246, 0.28); }
  .streamTitle {
    font-weight: 650;
    line-height: 1.25;
    word-break: break-word;
  }
  .url {
    font-size: 11px;
    color: #8f8f98;
    word-break: break-all;
    margin-top: 4px;
  }
  .thumbRow {
    display: flex;
    gap: 10px;
    align-items: stretch;
  }
  .thumb {
    width: 120px;
    min-height: 68px;
    border-radius: 10px;
    background: linear-gradient(135deg, #4b5563, #111827 70%);
    border: 1px solid #3a3a42;
    position: relative;
    overflow: hidden;
    flex: 0 0 auto;
  }
  .thumb::after {
    content: "HLS";
    position: absolute;
    left: 8px;
    bottom: 8px;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.45);
    color: #fff;
  }
  .controls {
    min-width: 0;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .row {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  select, button {
    font: inherit;
    background: #313139;
    color: #ececee;
    border: 1px solid #44444d;
    border-radius: 8px;
    padding: 6px 8px;
  }
  select { min-width: 0; flex: 1; }
  button { cursor: pointer; }
  button:hover { background: #3b3b45; }
  button.primary {
    background: linear-gradient(90deg, #38bdf8, #2563eb);
    border-color: transparent;
    color: #06111f;
    font-weight: 700;
  }
  .dur { color: #4ade80; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .empty {
    padding: 22px 14px 24px;
    color: #9ca3af;
    text-align: center;
  }
  .status {
    min-height: 16px;
    font-size: 11px;
    color: #a1a1aa;
    font-variant-numeric: tabular-nums;
  }
  button:disabled { opacity: 0.55; cursor: default; }

  /* --- icons --- */
  .ico { width: 16px; height: 16px; flex: 0 0 auto; }

  /* --- flat (non-gradient) solid button --- */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: #2563eb; color: #fff; border: 1px solid #2563eb;
    border-radius: 999px; padding: 7px 14px; font: inherit; font-weight: 650;
    cursor: pointer;
  }
  .btn:hover { background: #1d4ed8; }
  .btn:disabled { opacity: 0.55; cursor: default; }

  /* --- split button: Download + chevron --- */
  .split { position: relative; display: inline-flex; }
  .split .btn { border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .chev {
    display: inline-flex; align-items: center; padding: 7px 8px;
    background: #2563eb; color: #fff; border: 1px solid #2563eb;
    border-left-color: rgba(255, 255, 255, 0.28);
    border-radius: 0 999px 999px 0; cursor: pointer;
  }
  .chev:hover { background: #1d4ed8; }
  .menu {
    position: absolute; top: calc(100% + 4px); right: 0; z-index: 5;
    min-width: 176px; padding: 4px;
    background: #1f1f24; border: 1px solid #3a3a42; border-radius: 10px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
  }
  .menu button {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 8px 10px; border: 0; border-radius: 7px;
    background: transparent; color: #ececee; text-align: left; font: inherit;
    cursor: pointer;
  }
  .menu button:hover { background: #2e2e35; }

  /* --- outline icon button (Copy URL) --- */
  .iconBtn {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 6px;
    padding: 5px 10px; font: inherit;
    background: transparent; color: #c9cad1;
    border: 1px solid #3d3d46; border-radius: 999px; cursor: pointer;
  }
  .iconBtn:hover { background: #26262c; color: #ececee; }

  /* --- duration chip --- */
  .chip.dur { color: #4ade80; border-color: rgba(74, 222, 128, 0.28); background: rgba(74, 222, 128, 0.12); }
  .chip.dur .ico { width: 13px; height: 13px; }

  /* --- thumbnail --- */
  .thumb::after { display: none; }
  .thumb .play { position: absolute; inset: 0; margin: auto; width: 36px; height: 36px; color: rgba(255, 255, 255, 0.72); }
  .thumbBadge {
    position: absolute; left: 8px; bottom: 8px;
    font-size: 11px; font-weight: 700; padding: 2px 6px;
    border-radius: 999px; background: rgba(0, 0, 0, 0.5); color: #fff;
  }

  /* --- download progress --- */
  .progress { height: 6px; margin-top: 6px; border-radius: 999px; background: #2f2f35; overflow: hidden; }
  .progress > span { display: block; height: 100%; width: 0; background: #2563eb; transition: width 0.2s; }
</style>
<div class="shell">
  <div class="header">
    <div class="titleRow">
      <div class="brand"><span class="dot"></span> HLS Catcher</div>
      <div style="display:flex;align-items:center;gap:8px">
        <button class="iconBtn" id="dockBtn" type="button" title="Open in side panel" style="margin-top:0">
          <svg class="ico" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.25 3A2.25 2.25 0 0 0 2 5.25v9.5A2.25 2.25 0 0 0 4.25 17h11.5A2.25 2.25 0 0 0 18 14.75v-9.5A2.25 2.25 0 0 0 15.75 3H4.25ZM12 4.5v11h3.75a.75.75 0 0 0 .75-.75v-9.5a.75.75 0 0 0-.75-.75H12Z" clip-rule="evenodd"/></svg>
          Dock right
        </button>
        <div class="chip blue" id="countChip">0 found</div>
      </div>
    </div>
    <div class="subtitle">Capturing manifests from the active tab</div>
  </div>

  <div id="out" class="empty">Nothing yet - reload the page with the popup closed.</div>
</div>

<script type="module" src="popup.js"></script>
